{% extends "base.html" %}

{% block title %}Buscar Estudiantes{% endblock %}

{% block content %}

<div class="container mt-5">

    <h1 class="mb-4">
        Buscar estudiantes
    </h1>

    <div class="card p-4 shadow-sm">

        <form method="POST">

            <div class="row">

                <div class="col-md-5 mb-3">

                    <input
                    type="text"
                    name="search"
                    class="form-control"
                    placeholder="Nombre o apellido">

                </div>

                <div class="col-md-4 mb-3">

                    <select
                    name="course"
                    class="form-select">

                        <option value="" selected>
                            Seleccionar curso
                        </option>

                        <option value="1A">
                            1A
                        </option>

                        <option value="1B">
                            1B
                        </option>

                        <option value="1C">
                            1C
                        </option>

                    </select>

                </div>

                <div class="col-md-3 mb-3">

                    <button
                    type="submit"
                    class="btn btn-primary w-100">

                        Buscar

                    </button>

                </div>

            </div>

        </form>

    </div>

    <div class="card mt-4 shadow-sm">

        <div class="card-body">

            <table class="table table-hover">

                <thead class="table-dark">

                    <tr>

                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Curso</th>

                    </tr>

                </thead>

                <tbody>

                    {% for student in students %}

                    <tr>

                        <td>{{ student.nombre }}</td>
                        <td>{{ student.apellido }}</td>
                        <td>{{ student.curso }}</td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
