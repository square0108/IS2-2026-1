{% extends "base.html" %}

{% block title %}Editar Incidente{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h1 class="mb-4">
                Editar incidente
            </h1>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Fecha de creación
                    </label>

                    <input
                    type="text"
                    class="form-control"
                    value="{{ incident.created_at }}"
                    disabled>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Descripción del incidente
                    </label>

                    <textarea
                    name="description"
                    class="form-control"
                    rows="4">{{ incident.description }}</textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Estado
                    </label>

                    <select
                    name="status"
                    class="form-select">

                        <option
                        value="Abierto"
                        {% if incident.status == "Abierto" %}
                        selected
                        {% endif %}>

                            Abierto

                        </option>

                        <option
                        value="En proceso"
                        {% if incident.status == "En proceso" %}
                        selected
                        {% endif %}>

                            En proceso

                        </option>

                        <option
                        value="Finalizado"
                        {% if incident.status == "Finalizado" %}
                        selected
                        {% endif %}>

                            Finalizado

                        </option>

                    </select>

                </div>

                <div class="d-flex gap-2">

                    <button
                    type="submit"
                    class="btn btn-success">

                        Guardar cambios

                    </button>

                    <a
                    href="{{ url_for('incidents.incidents_list') }}"
                    class="btn btn-secondary">

                        Volver

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
