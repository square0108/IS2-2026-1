{% extends "base.html" %}

{% block title %} Abrir Nuevo Caso {% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-success">
                <div class="card-header bg-success text-white fw-bold">
                    Iniciar caso de investigación
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Ingrese un nombre descriptivo para agrupar los antecedentes de esta investigación.</p>
                    
                    <form method="POST" action="">
                        <div class="mb-4">
                            <label for="nombre_caso" class="form-label fw-bold">Nombre del caso de investigación</label>
                            <input type="text" class="form-control" id="nombre_caso" name="nombre_caso" placeholder="Ej: Conflicto recurrente en 1 Medio A" required>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('encargado_de_convivencia.home') }}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Abrir caso de investigación</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
